<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Yunzai 配置</title>
    <link rel="stylesheet" href="/yunzai/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23007aff'/%3E%3Crect x='16' y='20' width='32' height='4' rx='2' fill='white'/%3E%3Crect x='16' y='30' width='24' height='4' rx='2' fill='white' opacity='.85'/%3E%3Crect x='16' y='40' width='15' height='4' rx='2' fill='white' opacity='.7'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="gate" class="gate" hidden>
      <div class="gate-ambient" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="gate-card">
        <form id="gate-form" class="gate-form"></form>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <div class="app-icon" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="brand-copy">
            <h1>Yunzai</h1>
            <p id="brand-subtitle">配置</p>
          </div>
          <button id="sidebar-close" class="icon-button sidebar-close" type="button" aria-label="关闭配置列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
          </button>
        </div>

        <nav class="home-nav" aria-label="主页">
          <button id="home-nav" class="home-link active" type="button" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.4 12 4l8 6.4V19a1 1 0 0 1-1 1h-4.6v-5.4H9.6V20H5a1 1 0 0 1-1-1Z"></path></svg>
            <span>主页</span>
          </button>
        </nav>

        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.2"></circle>
            <path d="m15.5 15.5 4.2 4.2"></path>
          </svg>
          <input id="config-search" type="search" placeholder="搜索配置" autocomplete="off" spellcheck="false" aria-label="搜索配置" />
          <button id="config-search-clear" class="search-clear" type="button" aria-label="清除搜索" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8 8 8M16 8l-8 8"></path></svg>
          </button>
          <kbd class="search-hint" aria-hidden="true" title="按 / 聚焦搜索">/</kbd>
        </div>

        <nav id="config-groups" class="config-groups" aria-label="配置文件"></nav>
        <div id="sidebar-foot" class="sidebar-foot"></div>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div class="toolbar-title">
            <div class="title-row">
              <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="打开配置列表" aria-controls="sidebar" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
              </button>
              <h1 id="config-title">配置</h1>
              <span id="dirty" class="dirty" hidden>未保存</span>
            </div>
            <div class="path-row">
              <p id="config-path" class="toolbar-path"></p>
              <button id="copy-path" class="path-copy" type="button" aria-label="复制文件路径" title="复制文件路径" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
                  <path d="M6.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h8.5A1.5 1.5 0 0 1 15 5v1.5"></path>
                </svg>
              </button>
            </div>
            <p id="config-description" class="toolbar-desc" hidden></p>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button" data-theme-toggle type="button" aria-label="切换主题"></button>
            <div class="segmented" role="tablist" aria-label="编辑模式" data-mode="form">
              <button type="button" data-mode="form" class="active" role="tab" aria-selected="true">表单</button>
              <button type="button" data-mode="yaml" role="tab" aria-selected="false">YAML</button>
            </div>
            <button id="save" class="button primary" type="button" disabled>保存</button>
          </div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-icon" class="toast-icon" aria-hidden="true"></span>
      <span id="toast-text" class="toast-text"></span>
    </div>
    <div id="dialog" class="dialog-wrap" hidden></div>
    <div id="editor" class="editor-wrap" hidden>
      <div class="editor-card" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <header class="editor-head">
          <h2 id="editor-title">编辑文本</h2>
          <button id="editor-close" class="icon-button" type="button" aria-label="关闭编辑器">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
          </button>
        </header>
        <textarea id="editor-area" class="editor-area" spellcheck="false"></textarea>
        <footer class="editor-foot"><span id="editor-meta"></span><button id="editor-done" class="button primary" type="button">完成</button></footer>
      </div>
    </div>
    <script type="module" src="/yunzai/app.js"></script>
  </body>
</html>
