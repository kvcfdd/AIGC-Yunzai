# 统一管控浏览器实例与渲染器参数
browser:
  # 并发数
  concurrency: 4
  # 调用次数重启阈值
  restartNum: 100
  # 空闲回收，超过该时长无新任务时关闭浏览器释放内存
  # 下次调用自动惰性重启；填 0 或负数表示关闭回收
  # 单位：分钟
  idleTime: 30

# playwright 渲染器
playwright:
  # 缩放比例：越大质量越高，处理越慢、文件越大
  scale: 1.5
  # 注入全局样式(相当于套个滤镜)
  injectGlobalStyle: true

# HTTP 渲染服务
# http://127.0.0.1:1134/render
server:
  # 是否启用该服务(重启生效)
  enable: false
  # 监听地址
  host: 127.0.0.1
  # 监听端口
  port: 1134
  # 注入全局样式
  injectGlobalStyle: true
