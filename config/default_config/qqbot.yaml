# QQbot适配器

# 是否启用
enable: false

# 机器人列表，可同时连接多个
bots:
  # # 机器人 AppID
  - appid:
    # 机器人 AppSecret
    secret:
    # 连接方式：websocket / webhook
    # webhook 由 SDK 单独监听 webhook_port + webhook_path，需在 QQ 开放平台填写对应回调地址
    mode: websocket
    # 普通消息开关：开启后始终以普通消息发送，需要markdown 消息格式则关闭
    reply_text: true
    # 被动回复模式：开启时优先被动；关闭时优先主动，皆会自动降级切换
    passive_reply: false
    # webhook 相关配置，仅在 mode 为 webhook 时生效
    webhook_port: 6196
    webhook_path: /QQBot
