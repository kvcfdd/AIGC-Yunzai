# AIGC 开关
enable: false

# 模型配置列表 — 每个接口只列自己需要的字段
# 以下是四个api示例配置，可自行新增兼容模型
models:
  - name: gemini
    # API 基础地址，可填反代
    base_url: https://www.astrdark.cyou/ip/gemini
    # 附加请求头，如 { Authorization: "Bearer <token>" }
    headers: {}
    # 单次请求超时（毫秒）
    timeout_ms: 300000
    # API Key，至少一个；列表或逗号/分号/空白分隔字符串
    api_keys:
    # 实际模型名
    model: gemini-3.8-flash
    # 思考等级：minimal | low | medium | high
    thinking_level: high
    # 单次输出上限
    max_output_tokens: 65536
    # 失败重试次数 0-10
    retry_count: 0
    # 多模态能力；false 时转文本占位
    media:
      image: true
      audio: true
      video: true
      file: true
    # 透传额外请求体，如 { temperature: 0.7 }
    extra_body: {}

  - name: openai
    # OpenAI 兼容接口地址，填到 /v1 这一级
    base_url: https://api.openai.com/v1
    # 附加请求头
    headers: {}
    # 单次请求超时（毫秒）
    timeout_ms: 300000
    # API Key，至少一个
    api_keys:
    # 实际模型名；必填
    model:
    # 单次输出上限
    max_output_tokens: 65536
    # 输出上限字段：max_tokens | max_completion_tokens
    max_tokens_field: max_tokens
    # 失败重试次数 0-10
    retry_count: 0
    # 多模态能力；false 时转文本占位
    media:
      image: true
      audio: true
      video: false
      file: true
    # 透传额外请求体；如 { reasoning_effort: "medium", temperature: 1.0 }
    extra_body: {}

  - name: anthropic
    # Anthropic 接口地址
    base_url: https://api.anthropic.com
    # 附加请求头
    headers: {}
    # anthropic-version 请求头
    api_version: "2023-06-01"
    # 单次请求超时（毫秒）
    timeout_ms: 300000
    # API Key，至少一个
    api_keys:
    # 实际模型名；必填
    model:
    # 单次输出上限
    max_output_tokens: 65536
    # 失败重试次数 0-10
    retry_count: 0
    # 多模态能力；false 时转文本占位
    media:
      image: true
      audio: false
      video: false
      file: true
    # 透传额外请求体；如 extended thinking 配置
    extra_body: {}

  - name: responses
    # OpenAI Responses 接口地址，填到 /v1 这一级
    base_url: https://api.openai.com/v1
    # 附加请求头
    headers: {}
    # 单次请求超时（毫秒）
    timeout_ms: 300000
    # API Key，至少一个
    api_keys:
    # 实际模型名；必填
    model:
    # 单次输出Token上限
    max_output_tokens: 65536
    # 失败重试次数 0-10
    retry_count: 0
    # 多模态能力；false 时转文本占位
    media:
      image: true
      audio: false
      video: false
      file: true
    # 透传额外请求体；如 { reasoning: { effort: "medium" } }
    extra_body: {}

# 主对话使用的模型配置
model_config: gemini

# 主对话使用的 API
# 支持类型: gemini | openai | anthropic | responses
api: gemini

# 思考轮次上限 (2-50)
max_tool_rounds: 30

# 网页搜索
search:
  # 搜索源: anysearch | deepseek | tavily | bocha | brave | exa | firecrawl | baidu
  provider: anysearch
  # 搜索源 API Key：YAML 列表或英文逗号分隔，根据 provider 填写
  keys:

# 记忆系统/向量语义检索
embeddings:
  # 向量语义检索开关
  enable: false
  # 连接配置来源：复用该模型配置的 base_url 与 api_keys
  model_config: gemini
  # 向量模型使用的 API
  # 支持类型: gemini | openai
  api: gemini
  # 向量模型
  model: gemini-embedding-001
  # 输出维度
  dimensions: 768
  # 单条文本最大字符数，超出截断
  max_input_chars: 2000
  # 单次请求超时（毫秒）
  timeout_ms: 30000
  # 失败重试次数 0-10
  retry_count: 3
  # 附加请求头；如反代鉴权、伪装 UA
  # headers: { Authorization: "Bearer <token>", User-Agent: "Mozilla/5.0" }
  headers: {}
  # 透传额外请求体
  # extra_body: { title: "对话记录", encoding_format: "float" }
  extra_body: {}

# 机器人名称(AIGC相关日志显示)
bot_name: AIGC
# 系统提示词(预设与插话决策)
# 输出格式规范，自行按需写入提示词：
# 文字与语音二选一，不支持混排
# 只回复一条文字消息，直接回复
# 回复多条文字消息，在文本中插入<xix>分隔，例如：第一条文字<xix>第二条文字
# 回复语音，使用voice标签包裹文本，一次只发一条，示例：<voice>这是一条语音消息</voice>
# 直接输出no_reply则表示已读不回，不进行任何输出
system_prompt: |
  你是一个智能助手，帮助用户解决问题。请根据用户的需求提供准确、简洁、有用的回答。
  如果你不确定答案，请坦诚说明，而不是编造信息。
  请尽量使用中文回答，除非用户明确要求使用其他语言。

# MCP 工具服务器
mcp:
  servers: []
  # Streamable HTTP:
  #   - name: my-http-tools        # 服务器名
  #     type: http                 # http=Streamable HTTP
  #     url: http://localhost:3000/mcp  # 服务端 URL
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 headers.Authorization: Bearer <token>
  #     timeout_ms: 30000          # 请求超时（毫秒）
  #     protocol_mode: legacy      # legacy(兼容 2025 协议) | auto(探测 2026-07-28)
  #     # protocol_version: "2026-07-28"  # 可选，显式 pin 协议版本
  # SSE (旧版远程传输):
  #   - name: my-sse-tools
  #     type: sse                  # sse=旧版 SSE 传输
  #     url: http://localhost:3000/sse
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 Authorization: Bearer <token>
  #     timeout_ms: 30000
  # stdio:
  #   - name: my-local-tools
  #     type: stdio                # stdio=本地子进程
  #     command: npx               # 启动命令
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/dir"]  # 命令参数
  #     env: {}                    # 额外环境变量
  #     cwd: ""                    # 工作目录，留空为项目根目录
  #     timeout_ms: 30000

# 本地代理
proxy:
  # 代理 URL，如 http://127.0.0.1:7890，为空则不启用
  url:
  # LLM 请求是否走代理
  enable: false

# 私聊开关
private_chat_enable: true

# 群里裸 @bot 是否触发LLM
reply_on_bare_at: false

# 群白名单
group_whitelist:
#  - 123456789

# QQ 黑名单
qq_blacklist:
#  - 987654321

# 前缀过滤(这并不能拦住自动回复，这只是个示例，但LLM本身可以察觉并自行停止回复)
prefix_filter:
  - "[自动回复]"

# 群聊记录携带条数，0 则不携带
group_history_count: 30

# 上下文携带
# 历史累计到该轮数后，下一次请求只携带最近 context_keep_rounds 轮；0 则不携带
context_rounds: 30

# 精简后保留的最近轮数
context_keep_rounds: 10

# 上下文保留天数，超期轮次由定时任务整轮清理；0 表示不限制
context_retention_days: 0

# 是否将本轮过程以合并转发方式单独发送
show_thinking: false

# 水群模式：每条群消息按概率触发，0 表示关闭，LLM自己决定要不要回
proactive_group_chat:
  # 触发概率（0-100），0 表示关闭
  probability: 0
  # 使用的模型配置
  model_config: gemini
  # 使用的 API 类型
  api: gemini

# 语音合成 (TTS)
# 服务商: wusound | openai | gemini | minimax | elevenlabs | azure | volcengine | mimo | fishaudio | dashscope
voice:
  provider: wusound
  providers:
    # 悟声 Wusound
    wusound:
      api_key:
      voice_id:
      break_clone: true
      preset: balance
      speech_rate: 1
    # OpenAI 兼容 /audio/speech
    openai:
      api_key:
      base_url: "https://api.openai.com/v1"
      model: "tts-1"
      voice: "alloy"
      # wav | mp3 | opus | aac | flac | pcm
      response_format: "wav"
      speed: 1
      timeout_ms: 20000
      headers: {}
    # Gemini TTS
    gemini:
      api_key:
      base_url: "https://generativelanguage.googleapis.com"
      model: "gemini-2.5-flash-preview-tts"
      voice: "Leda"
      prefix: ""
      timeout_ms: 20000
    # MiniMax T2A v2
    minimax:
      api_key:
      base_url: "https://api.minimax.chat/v1/t2a_v2"
      group_id: ""
      model: "speech-02-turbo"
      voice_id: "female-shaonv"
      speed: 1.0
      vol: 1.0
      pitch: 0
      emotion: "auto"
      language_boost: "auto"
      format: "wav"
      sample_rate: 32000
      bitrate: 128000
      timeout_ms: 60000
    # ElevenLabs
    elevenlabs:
      api_key:
      base_url: "https://api.elevenlabs.io/v1"
      voice_id: "JBFqnCBsd6RMkjVDRZzb"
      model: "eleven_multilingual_v2"
      output_format: "mp3_44100_128"
      stability: ""
      similarity_boost: ""
      style: ""
      use_speaker_boost: true
      timeout_ms: 20000
    # Azure 语音服务
    azure:
      subscription_key:
      region: "eastus"
      voice: "zh-CN-YunxiaNeural"
      style: "cheerful"
      role: "Boy"
      rate: "1"
      volume: "100"
      lang: "zh-CN"
      output_format: "riff-48khz-16bit-mono-pcm"
      timeout_ms: 20000
    # 火山引擎语音合成
    volcengine:
      api_key:
      appid:
      cluster: "volcano_tts"
      voice_type:
      speed_ratio: 1.0
      base_url: "https://openspeech.bytedance.com/api/v1/tts"
      timeout_ms: 20000
    # MiMo TTS
    mimo:
      api_key:
      base_url: "https://api.xiaomimimo.com/v1"
      model: "mimo-v2.5-tts"
      voice: "mimo_default"
      format: "wav"
      style_prompt: ""
      dialect: ""
      seed_text: "Hello, MiMo, have you had lunch?"
      timeout_ms: 20000
    # FishAudio
    fishaudio:
      api_key:
      base_url: "https://api.fish.audio/v1"
      model: "s2-pro"
      reference_id: ""
      character: "可莉"
      format: "wav"
      timeout_ms: 20000
    # 阿里云百炼
    dashscope:
      api_key:
      base_url: "https://dashscope.aliyuncs.com/api/v1"
      model: "qwen-tts"
      voice: "Cherry"
      language_type: "auto"
      timeout_ms: 20000
