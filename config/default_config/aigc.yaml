# AIGC 开关
enable: false

# 模型配置列表 — 每个请求适配器只列自己需要的字段
# 以下是四个请求适配器示例配置，可自行新增兼容模型
# 建议使用webui界面配置，避免手动编辑
models:
    # 唯一标识名，作为 model_config 的引用
  - name: gemini
    # API 基础地址，可填反代
    base_url: https://www.astrdark.cyou/ip/gemini
    # 是否走代理
    proxy: false
    # API Key，至少一个；列表或逗号/分号/空白分隔字符串
    api_keys:
    # 实际模型名
    model: gemini-3.8-flash
    # 思考等级：minimal | low | medium | high
    thinking_level: high
    # 单次输出上限
    max_output_tokens: 65536
    # 失败重试次数 0-10
    retry_count: 0


# 主对话使用的模型配置
model_config: gemini

# 主对话使用的请求适配器
# 可选请求适配器: gemini | openai | anthropic | responses
adapter: gemini

# 思考轮次上限 (2-50)
max_tool_rounds: 30

# 工具安全审计 — 高风险工具执行前先由审计模型判断是否放行
security_audit:
  # 审计开关
  enable: false
  # 审计使用的模型配置；留空跟随全局默认
  model_config: gemini
  # 审计使用的请求适配器；留空跟随全局默认
  adapter: gemini

# 子代理
agent:
  # 子代理使用的模型配置
  model_config: gemini
  # 使用的请求适配器
  adapter: gemini

# 多模态识别 — 主模型配置不支持某类媒体时，用该模型配置识别并转为文本
multimodal:
  # 多模态识别模型配置
  model_config: gemini
  # 识别模型使用的请求适配器
  adapter: gemini

# 网页搜索
search:
  # 搜索源: anysearch | deepseek | tavily | bocha | brave | exa | firecrawl | baidu
  provider: anysearch
  # 搜索源 API Key：YAML 列表或英文逗号分隔，根据 provider 填写
  keys:
  # 是否走代理
  proxy: false

# 向量语义检索
embeddings:
  # 向量语义检索开关
  enable: false
  # 向量模型使用的请求适配器
  # 可选请求适配器: gemini | openai
  adapter: gemini
  # 向量模型配置
  model_config: gemini

# 文档知识库 — 导入资料供对话检索；向量化复用 aigc.embeddings
knowledge:
  # 知识库开关
  enable: false
  # 检索模式：auto=主对话每轮自动检索并注入实时状态；tool=仅暴露 kb_search 工具
  retrieval_mode: tool
  # 单文件大小上限 (MB)
  max_file_mb: 20
  # 分块长度（字符）
  chunk_size: 512
  # 相邻分块重叠（字符）
  chunk_overlap: 50
  # 每库稠密检索候选数
  top_k_dense: 50
  # 每库关键词检索候选数
  top_k_sparse: 50
  # 融合后候选数
  top_k_fusion: 20
  # 最终返回给模型的条数
  top_m_final: 5
  # 稠密权重 (0-1)，其余为稀疏权重
  dense_weight: 0.9
  # 稠密相似度下限 (0-1)，0 表示不过滤
  min_similarity: 0
  # 可选重排
  rerank:
    enable: false
    # 重排模型配置
    model_config: rerank
    # 重排后保留条数
    top_n: 5

# 机器人名称(AIGC相关日志显示)
bot_name: AIGC
# 系统提示词(预设与插话决策)
# 输出格式规范，自行按需写入提示词：
# 文字与语音二选一，不支持混排
# 只回复一条文字消息，直接回复
# 回复多条文字消息，在文本中插入<xix>分隔，例如：第一条文字<xix>第二条文字
# 回复语音，使用voice标签包裹文本，一次只发一条，示例：<voice>这是一条语音消息</voice>
# 直接输出no_reply则表示已读不回，不进行任何输出
system_prompt: |
  你是一个智能助手，帮助用户解决问题。请根据用户的需求提供准确、简洁、有用的回答。
  如果你不确定答案，请坦诚说明，而不是编造信息。
  请尽量使用中文回答，除非用户明确要求使用其他语言。

# MCP 工具服务器
mcp:
  servers: []
  # Streamable HTTP:
  #   - name: my-http-tools        # 服务器名
  #     type: http                 # http=Streamable HTTP
  #     url: http://localhost:3000/mcp  # 服务端 URL
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 headers.Authorization: Bearer <token>
  #     timeout_ms: 30000          # 请求超时（毫秒）
  #     protocol_mode: legacy      # legacy(兼容 2025 协议) | auto(探测 2026-07-28)
  #     # protocol_version: "2026-07-28"  # 可选，显式 pin 协议版本
  # SSE (旧版远程传输):
  #   - name: my-sse-tools
  #     type: sse                  # sse=旧版 SSE 传输
  #     url: http://localhost:3000/sse
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 Authorization: Bearer <token>
  #     timeout_ms: 30000
  # stdio:
  #   - name: my-local-tools
  #     type: stdio                # stdio=本地子进程
  #     command: npx               # 启动命令
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/dir"]  # 命令参数
  #     env: {}                    # 额外环境变量
  #     cwd: ""                    # 工作目录，留空为项目根目录
  #     timeout_ms: 30000

# 本地代理地址，如 http://127.0.0.1:7890
proxy:

# 私聊开关
private_chat_enable: true

# 群里裸 @bot 是否触发LLM
reply_on_bare_at: false

# 群白名单
group_whitelist:
#  - 123456789

# QQ 黑名单
qq_blacklist:
#  - 987654321

# 前缀过滤(这并不能拦住自动回复，这只是个示例，但LLM本身可以察觉并自行停止回复)
prefix_filter:
  - "[自动回复]"

# 群聊记录携带条数，0 则不携带
group_history_count: 30

# 上下文携带
# 历史累计到该轮数后，下一次请求只携带最近 context_keep_rounds 轮；0 则不携带
context_rounds: 30

# 精简后保留的最近轮数
context_keep_rounds: 10

# 上下文保留天数，超期轮次由定时任务整轮清理；0 表示不限制
context_retention_days: 0

# 是否将本轮过程以合并转发方式单独发送
show_thinking: false

# 旁听模式：每条群消息按概率触发，0 表示关闭，LLM自己决定要不要回
proactive_group_chat:
  # 触发概率（0-100），0 表示关闭
  probability: 0
  # 使用的模型配置
  model_config: gemini
  # 使用的请求适配器
  adapter: gemini

# 语音合成 (TTS)
# 服务商: wusound | openai | gemini | minimax | elevenlabs | azure | volcengine | mimo | fishaudio | dashscope
voice:
  provider: wusound
  providers:
    # 悟声 Wusound
    wusound:
      proxy: false
      api_key:
      voice_id:
      break_clone: true
      preset: balance
      speech_rate: 1
    # OpenAI 兼容 /audio/speech
    openai:
      proxy: false
      api_key:
      base_url: "https://api.openai.com/v1"
      model: "tts-1"
      voice: "alloy"
      # wav | mp3 | opus | aac | flac | pcm
      response_format: "wav"
      speed: 1
      timeout_ms: 20000
      headers: {}
    # Gemini TTS
    gemini:
      proxy: false
      api_key:
      base_url: "https://generativelanguage.googleapis.com"
      model: "gemini-2.5-flash-preview-tts"
      voice: "Leda"
      prefix: ""
      timeout_ms: 20000
    # MiniMax T2A v2
    minimax:
      proxy: false
      api_key:
      base_url: "https://api.minimax.chat/v1/t2a_v2"
      group_id: ""
      model: "speech-02-turbo"
      voice_id: "female-shaonv"
      speed: 1.0
      vol: 1.0
      pitch: 0
      emotion: "auto"
      language_boost: "auto"
      format: "wav"
      sample_rate: 32000
      bitrate: 128000
      timeout_ms: 60000
    # ElevenLabs
    elevenlabs:
      proxy: false
      api_key:
      base_url: "https://api.elevenlabs.io/v1"
      voice_id: "JBFqnCBsd6RMkjVDRZzb"
      model: "eleven_multilingual_v2"
      output_format: "mp3_44100_128"
      stability: ""
      similarity_boost: ""
      style: ""
      use_speaker_boost: true
      timeout_ms: 20000
    # Azure 语音服务
    azure:
      proxy: false
      subscription_key:
      region: "eastus"
      voice: "zh-CN-YunxiaNeural"
      style: "cheerful"
      role: "Boy"
      rate: "1"
      volume: "100"
      lang: "zh-CN"
      output_format: "riff-48khz-16bit-mono-pcm"
      timeout_ms: 20000
    # 火山引擎语音合成
    volcengine:
      proxy: false
      api_key:
      appid:
      cluster: "volcano_tts"
      voice_type:
      speed_ratio: 1.0
      base_url: "https://openspeech.bytedance.com/api/v1/tts"
      timeout_ms: 20000
    # MiMo TTS
    mimo:
      proxy: false
      api_key:
      base_url: "https://api.xiaomimimo.com/v1"
      model: "mimo-v2.5-tts"
      voice: "mimo_default"
      format: "wav"
      style_prompt: ""
      dialect: ""
      seed_text: "Hello, MiMo, have you had lunch?"
      timeout_ms: 20000
    # FishAudio
    fishaudio:
      proxy: false
      api_key:
      base_url: "https://api.fish.audio/v1"
      model: "s2-pro"
      reference_id: ""
      character: "可莉"
      format: "wav"
      timeout_ms: 20000
    # 阿里云百炼
    dashscope:
      proxy: false
      api_key:
      base_url: "https://dashscope.aliyuncs.com/api/v1"
      model: "qwen-tts"
      voice: "Cherry"
      language_type: "auto"
      timeout_ms: 20000
