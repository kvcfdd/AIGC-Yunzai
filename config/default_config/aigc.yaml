# AIGC 开关
enable: false

# 模型配置列表 — 每个接口只列自己需要的字段
# 可自行增加兼容对应接口的任意模型，如ds
models:
  - name: gemini
    # API 基础地址；默认 https://generativelanguage.googleapis.com，可填反代
    base_url: https://www.astrdark.cyou/ip/gemini
    # 附加请求头；默认 {}
    headers: {}
    # Gemini API 版本；默认 v1beta
    api_version: v1beta
    # 单次请求超时（毫秒）
    timeout_ms: 300000
    # API Key，至少一个；列表或英文逗号分隔字符串
    api_keys:
    # 实际模型名
    model: gemini-3.8-flash
    # 思考等级 minimal/low/medium/high；默认 medium
    thinking_level: medium
    # 单次输出上限；默认 65536
    max_output_tokens: 65536
    # 失败重试次数 0-10；默认 0
    retry_count: 0
    # 多模态能力；false 时转文本占位
    media:
      image: true
      audio: true
      video: true
      file: true
    # 透传额外请求体；默认 {}
    extra_body: {}

  # 其他模型配置示例，对应类型接口支持的所有配置项，为空则用默认值
