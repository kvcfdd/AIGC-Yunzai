  #   max_tokens_field: max_tokens
  #   # 失败重试次数 0-10；默认 0
  #   retry_count: 0
  #   # 多模态能力；false 时转文本占位
  #   media:
  #     image: true
  #     audio: true
  #     video: false
  #     file: true
  #   # 透传额外请求体；如 { reasoning_effort: "medium", temperature: 1.0 }
  #   extra_body: {}

  # - name: anthropic
  #   # Anthropic 接口地址
  #   base_url: https://api.anthropic.com
  #   # 附加请求头；默认 {}
  #   headers: {}
  #   # anthropic-version 请求头；默认 2023-06-01
  #   api_version: "2023-06-01"
