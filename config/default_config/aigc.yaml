# AIGC 开关
enable: false

# Google Gemini
gemini:
  # 可替换为兼容 Google Gemini API 的反代地址
  endpoint: https://generativelanguage.googleapis.com
  # 多 Key 用英文逗号分隔，如 "xxx,yyy"
  api_key: 
  # 模型
  model: gemini-3.6-flash
  # 有状态模式：服务端管理上下文
  stateful: false
  # 思考等级 minimal, low, medium, high
  thinking_level: medium

# 输出最大长度
max_tokens: 8096
# 工具调用轮次上限 (2-10)
max_tool_rounds: 5
# 请求失败重试次数 (0-10, 0不重试)
retry_count: 0
# 机器人名称(AIGC相关日志显示)
bot_name: AIGC
# 系统提示词(预设与插话决策)
system_prompt: |
  你是一个智能助手，帮助用户解决问题。请根据用户的需求提供准确、简洁、有用的回答。
  如果你不确定答案，请坦诚说明，而不是编造信息。
  请尽量使用中文回答，除非用户明确要求使用其他语言。

# MCP 工具服务器 (支持 Streamable HTTP 和 stdio)
mcp:
  servers: []
  # Streamable HTTP 传输:
  #   - name: my-http-tools
  #     transport: http
  #     url: http://localhost:3000/mcp
  #     api_key: ""
  #     timeout_ms: 30000
  #     protocol_version: "2025-11-25"  # 可选，默认 2025-11-25
  # stdio 传输:
  #   - name: my-local-tools
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/dir"]
  #     env: {}
  #     timeout_ms: 30000
  #     protocol_version: "2025-11-25"  # 可选，默认 2025-11-25

# 本地代理
proxy:
  # 代理地址，如 http://127.0.0.1:7890，为空则不启用
  address: 
  # LLM 请求是否走代理
  enable: false

# 私聊开关
private_enable: true
# 群白名单
group_whitelist:
#  - 123456789

# QQ 黑名单
qq_blacklist:
#  - 987654321

# 前缀过滤
prefix_filter:
  - "[自动回复]"

# 群聊记录携带条数，0 则不携带
group_history_count: 30
# 是否将思维链以合并转发方式单独发送
# 可能存在问题，非必要勿开
show_thinking: false

# B站 Cookie（用于视频搜索和下载，不填则使用匿名会话）
bilibili_cookie: 

# 定时任务系统
scheduled_task:
  # 总开关：关闭时无法创建定时任务
  enable: false
  # 用户白名单: 仅主人 + 名单内用户可使用定时任务系统
  qq_whitelist:
  #  - 123456789

# 水群模式：每个群随机冷却时间，冷却期间不会触发，触发也不一定回，LLM自己决定要不要回
ambient:
  # 是否启用
  enable: false
  # 最小冷却，单位分钟
  cooldown_min: 30
  # 最大冷却，单位分钟
  cooldown_max: 60
  # 水群模型(记忆总结/搜索工具也用)
  model: gemini-3-flash-preview

# 语音合成 (悟声 Wusound TTS)
voice:
  # 悟声 API Key，在 https://dev.wusound.cn 开发者中心获取
  api_key: 
  # 默认语音角色 UUID
  voice_id: 
  # 是否启用启用偏向文本的情感风格
  break_clone: true
  # 参数预设: creative(创意/最佳表现力) | balance(均衡) | stable(稳定)
  preset: balance
  # 语速 0.5-2.0，越大越慢
  speech_rate: 1
