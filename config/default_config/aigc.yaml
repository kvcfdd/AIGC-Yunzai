# 主对话使用的模型配置
model_config: gemini
# 主对话使用的内置 API 支持类型: gemini | openai | anthropic | responses
api: gemini

# 工具调用轮次上限 (2-10)
max_tool_rounds: 5
# 机器人名称(AIGC相关日志显示)
bot_name: AIGC
# 系统提示词(预设与插话决策)
# 输出格式规范，自行按需写入提示词：
# 如果只回复一条文字消息，直接回复
# 如果要回复一条语音，请使用voice标签包裹文本，示例：<voice>这是一条语音消息</voice>
# 如果要发多条消息，则必须使用对应标签包裹文本，语音voice，文字reply，允许混用但不允许嵌套，比如两条文字消息：<reply>第一条文字消息</reply><reply>第二条文字消息</reply>
# 直接输出no_reply则表示已读不回，不进行任何输出
system_prompt: |
  你是一个智能助手，帮助用户解决问题。请根据用户的需求提供准确、简洁、有用的回答。
  如果你不确定答案，请坦诚说明，而不是编造信息。
  请尽量使用中文回答，除非用户明确要求使用其他语言。

# MCP 工具服务器
mcp:
  servers: []
  # Streamable HTTP:
  #   - name: my-http-tools        # 服务器名
  #     type: http                 # http=Streamable HTTP
  #     url: http://localhost:3000/mcp  # 服务端 URL
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 headers.Authorization: Bearer <token>
  #     timeout_ms: 30000          # 请求超时（毫秒）
  #     protocol_mode: legacy      # legacy(默认，兼容 2025 协议) | auto(探测 2026-07-28)
  #     # protocol_version: "2026-07-28"  # 可选，显式 pin 协议版本
  # SSE (旧版远程传输):
  #   - name: my-sse-tools
  #     type: sse                  # sse=旧版 SSE 传输
  #     url: http://localhost:3000/sse
  #     headers: {}                # 额外请求头
  #     # bearer_token: ""         # 等价于 Authorization: Bearer <token>
  #     timeout_ms: 30000
  # stdio:
  #   - name: my-local-tools
  #     type: stdio                # stdio=本地子进程
  #     command: npx               # 启动命令
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/dir"]  # 命令参数
  #     env: {}                    # 额外环境变量
  #     cwd: ""                    # 工作目录；默认项目根目录
  #     timeout_ms: 30000

# 本地代理
proxy:
  # 代理 URL，如 http://127.0.0.1:7890，为空则不启用
  url:
  # LLM 请求是否走代理
  enable: false

# 私聊开关
private_chat_enable: true
# 群里裸 @bot 是否触发LLM
reply_on_bare_at: false
# 群白名单
group_whitelist:
#  - 123456789

# QQ 黑名单
qq_blacklist:
#  - 987654321

# 前缀过滤(这并不能拦住自动回复，这只是个示例，但LLM本身可以察觉并自行停止回复)
prefix_filter:
  - "[自动回复]"

# 群聊记录携带条数，0 则不携带
group_history_count: 30

# 上下文携带
# 每次请求携带的历史轮数，0 则不携带
context_rounds: 20
# 工具结果完整保留的最近轮数，0 表示不再有完整保留的轮次
context_tool_full_rounds: 7
# 更早轮次工具结果的截断长度，0 表示不截断
context_tool_max_chars: 200
# 上下文保留天数，超期轮次由定时任务整轮清理；0 表示不限制
context_retention_days: 0
# 是否将本轮过程以合并转发方式单独发送
# 可能存在问题，非必要勿开
show_thinking: false

# B站 Cookie（用于视频搜索和下载，不填则使用匿名会话）
bilibili_cookie: 

# 水群模式：每个群随机冷却时间，冷却期间不会触发，触发也不一定回，LLM自己决定要不要回
proactive_group_chat:
  # 是否启用
  enable: false
  # 最小冷却，单位分钟
  cooldown_min: 30
  # 最大冷却，单位分钟
  cooldown_max: 60
  # 使用的模型配置
  model_config: gemini
  # 使用的 API 类型
  api: gemini

# 语音合成 (悟声 Wusound TTS)
voice:
  # 悟声 API Key，在 https://dev.wusound.cn 开发者中心获取
  api_key: 
  # 默认语音角色 UUID
  voice_id: 
  # 是否启用启用偏向文本的情感风格
  break_clone: true
  # 参数预设: creative(创意/最佳表现力) | balance(均衡) | stable(稳定)
  preset: balance
  # 语速 0.5-2.0，越大越慢
  speech_rate: 1
