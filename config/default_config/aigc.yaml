# AIGC 开关
enable: false

# AIGC Provider: openai | gemini
provider: openai

# OpenAI 兼容接口
openai:
  endpoint: https://api.openai.com # 可替换为兼容 OpenAI API 的其他服务地址
  api_key: "" # 多 Key 用英文逗号分隔，如 "sk-xxx,sk-yyy"
  model: gpt-4o-mini # 模型
  thinking_effort: "" # 思考等级，留空=关闭思考，按提供商要求填写

# Google Gemini
gemini:
  endpoint: https://generativelanguage.googleapis.com # 可替换为兼容 Google Gemini API 的反代地址
  api_key: "" # 多 Key 用英文逗号分隔，如 "xxx,yyy"
  model: gemini-3.5-flash # 模型
  thinking_level: minimal # 思考等级 minimal, low, medium, high

# 输出最大长度
max_tokens: 4096
# 输出随机程度 (0-1，值越大输出越随机)
temperature: 1
# 工具调用轮次上限 (2-10)
max_tool_rounds: 5
# 请求失败重试次数 (0-5, 0不重试)
retry_count: 0
# 机器人名称(AIGC相关日志显示)
bot_name: AIGC
# 系统提示词
system_prompt: |
  你是一个智能助手，帮助用户解决问题。请根据用户的需求提供准确、简洁、有用的回答。
  如果你不确定答案，请坦诚说明，而不是编造信息。
  请尽量使用中文回答，除非用户明确要求使用其他语言。

# MCP 工具服务器 (支持 Streamable HTTP 和 stdio)
mcp:
  servers: []
  # Streamable HTTP 传输:
  #   - name: my-http-tools
  #     transport: http
  #     url: http://localhost:3000/mcp
  #     api_key: ""
  #     timeout_ms: 30000
  #     protocol_version: "2025-11-25"  # 可选，默认 2025-11-25
  # stdio 传输:
  #   - name: my-local-tools
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/allowed/dir"]
  #     env: {}
  #     timeout_ms: 30000
  #     protocol_version: "2025-11-25"  # 可选，默认 2025-11-25

# 本地代理
proxy:
  address: "" # 代理地址，如 http://127.0.0.1:7890，为空则不启用
  enable: true # LLM 请求是否走代理

# 私聊开关
private_enable: true
# 群白名单
group_whitelist:
#  - 123456789

# QQ 黑名单
qq_blacklist:
#  - 987654321

# 前缀过滤
prefix_filter:
  - "[自动回复]"

# 群聊记录携带条数，0 则不携带
group_history_count: 30
# 是否将思维链以合并转发方式单独发送
show_thinking: false
# 是否允许分句回复
split_reply: false
# openai推理内容兼容，没出问题就勿动
strip_reasoning: false
# B站 Cookie（用于视频搜索和下载，不填则使用匿名会话）
bilibili_cookie: ""
# 水群模式：每个群随机冷却时间，冷却期间不会触发，触发也不一定回，LLM自己决定要不要回
ambient:
  enable: false # 是否启用
  cooldown_min: 30 # 最小冷却，单位分钟
  cooldown_max: 60 # 最大冷却，单位分钟
  provider: "" # 分流 provider: 留空走全局, openai | gemini
  model: "" # 分流模型，留空走全局，

# 语音合成 (悟声 Wusound TTS)
voice:
  api_key: "" # 悟声 API Key，在 https://dev.wusound.cn 开发者中心获取
  voice_id: "" # 默认语音角色 UUID
  break_clone: true # 是否启用启用偏向文本的情感风格
  preset: balance # 参数预设: creative(创意/最佳表现力) | balance(均衡) | stable(稳定)
  speech_rate: 1 # 语速 0.5-2.0，越大越慢
