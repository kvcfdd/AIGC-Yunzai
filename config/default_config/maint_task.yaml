# 总开关
enable: false

# 定时 cron
cron: "0 20 4 * * *"

# Git 仓库路径，支持相对路径和绝对路径，更新为强制更新，仅用于辅助图像仓库更新
git_paths:
  - "plugins/miao-plugin/resources/profile"

# 清理路径，支持相对路径和绝对路径
clean_paths:
  - "data/aigc"
  - "logs"

# 文件最小存在时长(天)：仅删除已存在超过该时长的文件，0 表示不限制
clean_min_age_days: 3

# Git 命令超时 (毫秒)
timeout: 120000

# Mihomo 代理订阅 (仅支持Linux系统)
mihomo:
  # 是否启用代理订阅维护
  enable: false
  # 代理订阅链接
  sub_url: 
  #节点过滤
  exclude_regex: "中国大陆|香港|台湾|俄罗斯"
  # 代理订阅配置文件路径
  config_path: "/etc/mihomo/config.yaml"
  # 自启动systemctl中的对应名称用于重启
  service_name: "mihomo"
  # 分流规则
  rules:
    - "MATCH,♻️自动选择"
